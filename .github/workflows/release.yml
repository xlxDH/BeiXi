name: Build release packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
permissions:
  contents: write
jobs:
  packages:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Install, verify and build without local credentials
        run: |
          npm ci
          node tests/connections.mjs
          node tests/maps.mjs
          npm run build:release
          npx cap sync android
          npx cap copy ios
      - name: Android test-signed APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Bundle desktop and unsigned iOS project
        run: |
          python scripts/package-release.py
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-assets/BeiXi-${TAG}-android-test-signed.apk"
          git archive --format=zip --prefix="BeiXi-${TAG}-source/" -o "release-assets/BeiXi-${TAG}-source-code.zip" HEAD
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Upload assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "BeiXi $TAG" --notes-file docs/release-v1.1.0.md
          gh release upload "$TAG" release-assets/* --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: release-assets/*
